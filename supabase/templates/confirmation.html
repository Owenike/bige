<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BIG E FITNESS 員工帳號啟用</title>
  </head>
  <body style="margin:0;background:#eef3f8;color:#17243a;font-family:Arial,'Noto Sans TC',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef3f8;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #dce4ed;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="background:#17243a;padding:24px 32px;color:#ffffff;">
                <div style="font-size:22px;font-weight:700;">BIG E FITNESS</div>
                <div style="margin-top:6px;font-size:13px;color:#d8c58f;">員工後台帳號安全驗證</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 16px;font-size:24px;line-height:1.4;">您的員工帳號已建立</h1>
                <p style="margin:0 0 12px;font-size:16px;line-height:1.8;">您好，主管已為您建立 BIG E FITNESS 員工後台帳號。</p>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.8;color:#536178;">
                  登入 Email：<strong style="color:#17243a;">{{ .Email }}</strong><br />
                  請點擊下方按鈕完成 Email 驗證，並設定只有您本人知道的新密碼。
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="border-radius:7px;background:#26364d;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;">
                        驗證 Email 並設定後台密碼
                      </a>
                    </td>
                  </tr>
                </table>
                <div style="margin-top:28px;padding:16px;background:#f5f7fa;border-left:3px solid #b2964d;color:#536178;font-size:13px;line-height:1.7;">
                  此連結僅能使用一次，請勿轉寄或提供給他人。若您未申請此帳號，請勿點擊連結，並立即聯絡主管。
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;border-top:1px solid #e6ebf1;color:#7a8799;font-size:12px;line-height:1.7;">
                此信件由 BIG E FITNESS 員工帳號系統自動寄送，請勿直接回覆。
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
